# Site do portfólio. Instalar com:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo cp deploy/nginx-limits.conf /etc/nginx/conf.d/portfolio-limits.conf
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Os dois arquivos andam juntos: o `limit_req` daqui usa a zona declarada lá, e
# sem ela o nginx nem sobe.
#
# Confira antes que o nginx conheça wasm:
#
#   grep wasm /etc/nginx/mime.types
#
# Se não aparecer nada, acrescente `application/wasm  wasm;` ao bloco `types`
# desse arquivo. Sem o MIME certo o instantiateStreaming falha e o emscripten
# cai no caminho lento — o DOOM abre, mas demora mais.

server {
    listen 8080;
    listen [::]:8080;
    server_name oluizfernando.com.br;

    root /srv/portfolio/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/json;
    gzip_min_length 1024;

    # Nomes com hash: a URL muda a cada versão, então pode cachear para sempre.
    location /assets/ { expires 1y;  add_header Cache-Control "public, immutable"; }
    location /fonts/  { expires 1y;  add_header Cache-Control "public, immutable"; }
    location /doom/   { expires 30d; add_header Cache-Control "public"; }

    # Único nome fixo do site. Sem isto, o Cloudflare serviria a versão velha e
    # os arquivos com hash novos nunca seriam pedidos.
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Ajustes herdados pelas duas rotas de /api. Ficam aqui, e não repetidos
    # dentro de cada location, porque location irmã não herda de location irmã.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;
    # Se a API cair, o site continua: o terminal trata a ausência dela, e
    # esperar 60s por um upstream morto é pior do que falhar rápido.
    proxy_connect_timeout 2s;

    # A API fala a verdade sobre a máquina agora — cachear seria mentir. O
    # /api/stats já tem cache de 2s do lado do uvicorn, que é o que segura um
    # `top` ao vivo por visitante.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-store" always;
    }

    # O único endpoint de escrita do projeto, e por isso o único com limite. A
    # zona vem de deploy/nginx-limits.conf, que mora em conf.d/ porque
    # limit_req_zone só existe no contexto http.
    #
    # 4k de corpo é muito mais do que um lote de 50 comandos ocupa, e muito
    # menos do que vale a pena tentar mandar para cá.
    location = /api/log {
        limit_req zone=portfolio_log burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;

        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-store" always;
    }

    location / { try_files $uri $uri/ /index.html; }
}
