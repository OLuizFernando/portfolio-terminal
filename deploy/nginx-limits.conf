# Vai em /etc/nginx/conf.d/portfolio-limits.conf, não em sites-available: um
# `limit_req_zone` só existe no contexto http, e o bloco `server` do site é
# incluído dentro dele.
#
#   sudo cp deploy/nginx-limits.conf /etc/nginx/conf.d/portfolio-limits.conf
#
# O deploy-portfolio reinstala este arquivo sozinho quando ele muda.

# Atrás do túnel da Cloudflare, TODA requisição chega de 127.0.0.1 — o
# $binary_remote_addr é o mesmo para o mundo inteiro e não serve de chave. Quem
# distingue é o CF-Connecting-IP, que o cloudflared põe. O fallback existe para
# quando alguém fala com a porta 8080 direto, de dentro da rede.
map $http_cf_connecting_ip $portfolio_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# 30 lotes por minuto por visitante. Um lote leva até 10 comandos, então isto é
# generoso para quem digita e apertado para quem só quer engordar o arquivo.
#
# O contador vive nesta memória compartilhada e em lugar nenhum além dela: não
# vai para disco e some quando o nginx reinicia. O /etc/privacy diz isso.
limit_req_zone $portfolio_client zone=portfolio_log:1m rate=30r/m;
